<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Books | Book Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<script type="module" src="./js/books.js"></script>
<body class="min-h-screen bg-stone-50 text-slate-800">

  <header class="border-b border-stone-200 bg-white">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
      <a href="./index.html" class="text-2xl font-extrabold">
        Book<span class="text-amber-600">Explorer.</span>
      </a>
      <div class="flex gap-5">
        <a href="./index.html">Home</a>
        <a href="./books.html">Books</a>
        <a href="./favorites.html">Favorites</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-12">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold md:text-4xl">Explore Books</h1>
      <p class="mt-2 text-slate-600">Discover your next favorite read.</p>
    </div>

    <form id="search-form" class="mb-8 flex flex-col gap-3 sm:flex-row">
      <input id="search-input" type="search"
        placeholder="Search books or authors..."
        class="min-w-0 flex-1 rounded-lg border border-stone-300 bg-white px-4 py-3"
        required>
      <button class="rounded-lg bg-amber-500 px-6 py-3 font-bold text-white hover:bg-amber-600">
        Search
      </button>
    </form>

    <div class="mb-6 flex flex-wrap items-center gap-3">
      <label for="sort-select">Sort:</label>
      <select id="sort-select" class="rounded-lg border border-stone-300 bg-white p-2">
        <option value="title">Title A–Z</option>
        <option value="year">Newest first</option>
      </select>

     
    </div>

    <p id="status-message" class="mb-5 text-slate-600" aria-live="polite">
      Loading books...
    </p>

    <div id="books-grid"
      class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

      <!-- Responsive placeholder cards -->
      <article class="book-card"><div class="book-cover">📚</div><div class="p-5"><h2>Book Placeholder 1</h2><p>Author name</p><button type="button">View Details</button></div></article>
      <article class="book-card"><div class="book-cover">📚</div><div class="p-5"><h2>Book Placeholder 2</h2><p>Author name</p><button type="button">View Details</button></div></article>
      <article class="book-card"><div class="book-cover">📚</div><div class="p-5"><h2>Book Placeholder 3</h2><p>Author name</p><button type="button">View Details</button></div></article>
      <article class="book-card"><div class="book-cover">📚</div><div class="p-5"><h2>Book Placeholder 4</h2><p>Author name</p><button type="button">View Details</button></div></article>
    </div>

    <section id="book-details" class="mt-10" hidden></section>
  </main>

  <footer class="border-t border-stone-200 bg-white py-6 text-center text-sm text-slate-500">
    Book Explorer — Discover your next favorite read.
  </footer>

  <script type="module" src="./js/books.js"></script>
</body>
</html>
