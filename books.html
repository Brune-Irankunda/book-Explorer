
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Books | Book Explorer</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="min-h-screen bg-stone-50 text-slate-800">

  <header class="border-b bg-white">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
      <a href="./index.html" class="text-2xl font-extrabold">
        Book<span class="text-amber-600">Explorer.</span>
      </a>
      <a href="./index.html" class="font-medium text-amber-700">
        Back to Categories
      </a>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-12">

    <h1 id="page-title" class="text-3xl font-bold md:text-5xl">
      Explore Books
    </h1>

    <p id="page-description" class="mt-3 text-slate-600">
      Search for books and discover your next read.
    </p>

    <!-- Search interface -->
    <form id="search-form" class="mt-8 flex flex-col gap-3 sm:flex-row">
      <input
        id="search-input"
        type="search"
        placeholder="Search books, authors, or topics..."
        class="flex-1 rounded-xl border border-stone-300 bg-white px-4 py-3"
      >

      <button
        type="submit"
        class="rounded-xl bg-amber-600 px-6 py-3 font-bold text-white hover:bg-amber-700"
      >
        Search
      </button>
    </form>

    <!-- Results status -->
    <div class="mt-6 flex items-center justify-between gap-4">
      <p id="status" role="status" aria-live="polite">
        Loading books...
      </p>

      <select id="sort-select"
        aria-label="Sort books"
        class="rounded-lg border bg-white px-3 py-2">
        <option value="title">Title A–Z</option>
        <option value="year-new">Newest first</option>
        <option value="year-old">Oldest first</option>
      </select>
    </div>

    <!-- API results appear here -->
    <section
      id="book-grid"
      class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"
    ></section>

  </main>

  <footer class="mt-12 bg-slate-950 py-6 text-center text-sm text-white">
    Books provided by
    <a href="https://openlibrary.org" target="_blank"
       rel="noopener noreferrer" class="underline">
      Open Library
    </a>
  </footer>

  <script type="module" src="./js/books.js"></script>
</body>
</html>
